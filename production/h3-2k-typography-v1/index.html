<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>좀비 인 동탄 EP01 · 타이포그래픽 편집본</title><style>*{box-sizing:border-box}body{margin:0;background:#09090d;color:#f7f5fa;font:16px/1.7 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px 20px}h1{font-size:clamp(26px,5vw,46px);line-height:1.3}a{color:#b38aff}video{display:block;width:100%;max-height:78vh;background:#000}.links{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}.muted{color:#aea8ba}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.shot{padding:0;background:#19151f;color:white;text-align:left;border:1px solid #3b3048;border-radius:10px;overflow:hidden;cursor:pointer}.shot img{width:100%;height:auto;display:block}.shot span{display:block;padding:12px}button:focus-visible,a:focus-visible{outline:3px solid #b38aff}</style><main><a href="../../index.html#film">← 스토리보드</a><h1>좀비 인 동탄 · EP.01<br>아빠의 약 — 7번이 나왔다</h1><p>2K · 약 2분 54초 · 상황 설명 4장 · 대사 사이 여유 11곳</p><video controls playsinline preload="metadata" poster="포스터.jpg" src="EP01_2K_타이포_대사_선택BGM.mp4"></video><div class="links"><a href="EP01_2K_타이포_대사_선택BGM.mp4" download>2K 영상 내려받기</a><a href="대사.srt" download>대사 자막 (자동 인식)</a><a href="타이포그래픽_4장.jpg" target="_blank">설명 화면 모아 보기</a><a href="../h3-2k-dialogue-v1/">이전 원본 대사 버전</a></div><p class="muted">원본 대사와 효과음을 유지하고, 대사 사이에 0.5~0.75초의 여유를 더했습니다. 검은 배경·흰 큰 글자·보라색 강조로 상황을 설명합니다. 나레이션은 없습니다. BGM은 긴장·변신·탈출 등 5개 구간, 총 약 42초에만 사용하며 대사 중에는 낮춥니다.</p><h2>장면 바로 보기</h2><div class="grid"><button class="shot" data-time="0"><img src="stills/S01.jpg" width="640" height="360" loading="lazy" alt="S01"><span>S01 · 00:00<br>동탄에서 원인을 알 수 없는 집단 공격이 시작됐다.</span></button><button class="shot" data-time="6"><img src="stills/S02.jpg" width="640" height="360" loading="lazy" alt="S02"><span>S02 · 00:06<br>재난문자가 울렸다. 큰 소리를 내지 마십시오.</span></button><button class="shot" data-time="13.0"><img src="cards/01.png" width="640" height="360" loading="lazy" alt="설명 01"><span>설명 01 · 00:13<br>밖은 이미 안전하지 않다</span></button><button class="shot" data-time="17.0"><img src="stills/S03.jpg" width="640" height="360" loading="lazy" alt="S03"><span>S03 · 00:17<br>사흘 뒤, 호수공원의 노을 아래 좀비들이 서성였다.</span></button><button class="shot" data-time="24.0"><img src="cards/02.png" width="640" height="360" loading="lazy" alt="설명 02"><span>설명 02 · 00:24<br>아빠의 약을 구하러 간다</span></button><button class="shot" data-time="28.0"><img src="stills/S04.jpg" width="640" height="360" loading="lazy" alt="S04"><span>S04 · 00:28<br>아픈 아빠를 위해, 엄마와 서진은 루나와 함께 약을 구했다.</span></button><button class="shot" data-time="36.25"><img src="stills/S05.jpg" width="640" height="360" loading="lazy" alt="S05"><span>S05 · 00:36<br>약만 챙겨 돌아가려던 순간, 간판이 쓰러졌다.</span></button><button class="shot" data-time="42.25"><img src="stills/S06.jpg" width="640" height="360" loading="lazy" alt="S06"><span>S06 · 00:42<br>소리를 들은 좀비들이 한꺼번에 달려왔다.</span></button><button class="shot" data-time="48.25"><img src="stills/S07.jpg" width="640" height="360" loading="lazy" alt="S07"><span>S07 · 00:48<br>세 식구가 도착한 경사로 끝에는 또 다른 무리가 있었다.</span></button><button class="shot" data-time="55.25"><img src="stills/S08.jpg" width="640" height="360" loading="lazy" alt="S08"><span>S08 · 00:55<br>앞도, 뒤도 막혔다. 도망칠 길이 보이지 않았다.</span></button><button class="shot" data-time="62.25"><img src="stills/S09.jpg" width="640" height="360" loading="lazy" alt="S09"><span>S09 · 01:02<br>엄마가 던진 휴대폰에 좀비들이 몰렸다. 하지만 전부는 아니었다.</span></button><button class="shot" data-time="69.25"><img src="stills/S10.jpg" width="640" height="360" loading="lazy" alt="S10"><span>S10 · 01:09<br>엄마는 간판을 들어 막았다. 서진에게 남은 건 손목의 시계였다.</span></button><button class="shot" data-time="76.75"><img src="cards/03.png" width="640" height="360" loading="lazy" alt="설명 03"><span>설명 03 · 01:16<br>퇴로가 사라졌다</span></button><button class="shot" data-time="80.75"><img src="stills/S11.jpg" width="640" height="360" loading="lazy" alt="S11"><span>S11 · 01:20<br>보라색 삐에로가 시계 밖으로 튀어나와 커졌다.</span></button><button class="shot" data-time="87.75"><img src="stills/S12.jpg" width="640" height="360" loading="lazy" alt="S12"><span>S12 · 01:27<br>팔 번을 스친 룰렛이, 일곱 번에서 멈췄다.</span></button><button class="shot" data-time="93.75"><img src="stills/S13.jpg" width="640" height="360" loading="lazy" alt="S13"><span>S13 · 01:33<br>붉고 금빛인 슈트가 서진의 몸을 감싸기 시작했다.</span></button><button class="shot" data-time="101.5"><img src="stills/S14.jpg" width="640" height="360" loading="lazy" alt="S14"><span>S14 · 01:41<br>기뻐할 틈도 없이, 좀비들이 다시 밀려왔다.</span></button><button class="shot" data-time="110.33333333333333"><img src="stills/S15.jpg" width="640" height="360" loading="lazy" alt="S15"><span>S15 · 01:50<br>서진은 손목을 겨눴다. 실패 끝에 거미줄이 뻗어 나갔다.</span></button><button class="shot" data-time="117.33333333333333"><img src="stills/S16.jpg" width="640" height="360" loading="lazy" alt="S16"><span>S16 · 01:57<br>경사로를 가로지른 거미줄 그물이 좀비들을 붙잡았다.</span></button><button class="shot" data-time="125.33333333333333"><img src="stills/S17.jpg" width="640" height="360" loading="lazy" alt="S17"><span>S17 · 02:05<br>서진이 엄마와 루나를 붙잡고, 거미줄에 몸을 실었다.</span></button><button class="shot" data-time="132.0"><img src="stills/S18.jpg" width="640" height="360" loading="lazy" alt="S18"><span>S18 · 02:12<br>호수 옆을 가르는 세 식구. 마지막 장애물이 눈앞으로 다가왔다.</span></button><button class="shot" data-time="140.0"><img src="stills/S19.jpg" width="640" height="360" loading="lazy" alt="S19"><span>S19 · 02:20<br>무사히 착지하자, 슈트는 다시 시계 속으로 사라졌다.</span></button><button class="shot" data-time="147.0"><img src="stills/S20.jpg" width="640" height="360" loading="lazy" alt="S20"><span>S20 · 02:27<br>엄마가 약을 확인했다. 이제 아빠에게 돌아가면 된다.</span></button><button class="shot" data-time="155.66666666666666"><img src="cards/04.png" width="640" height="360" loading="lazy" alt="설명 04"><span>설명 04 · 02:35<br>이제, 집으로</span></button><button class="shot" data-time="159.66666666666666"><img src="stills/S21.jpg" width="640" height="360" loading="lazy" alt="S21"><span>S21 · 02:39<br>하지만 집으로 가는 길에도, 더 큰 무리가 기다리고 있었다.</span></button><button class="shot" data-time="166.16666666666666"><img src="stills/S22.jpg" width="640" height="360" loading="lazy" alt="S22"><span>S22 · 02:46<br>서진이 다시 버튼을 눌렀다. 이번에는, 몇 번일까.</span></button></div></main><script>const v=document.querySelector('video');document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{v.currentTime=Number(b.dataset.time);v.play().catch(()=>{});v.scrollIntoView({behavior:'smooth',block:'center'})})</script></html>
