<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>좀비 인 동탄 EP01 · 원본 대사 + 효과음 · 2K</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1620;color:#ecf1f7;font:16px/1.7 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px 20px}h1{font-size:clamp(26px,5vw,46px);line-height:1.3}a{color:#90d6ff}video{display:block;width:100%;max-height:78vh;background:#000}.links{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}.muted{color:#aebccd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.shot{padding:0;background:#1c2939;color:white;text-align:left;border:1px solid #3c4c60;border-radius:10px;overflow:hidden;cursor:pointer}.shot img{width:100%;height:auto;display:block}.shot span{display:block;padding:12px}button:focus-visible,a:focus-visible{outline:3px solid #93dcff}</style><main><a href="../../index.html#film">← 스토리보드</a><h1>좀비 인 동탄 · EP.01<br>아빠의 약 — 7번이 나왔다</h1><p>H3 2K · 22장면 · 2분 31초 · 원본 대사 + 효과음 · 설명 나레이션 없음</p><video controls playsinline preload="metadata" poster="포스터.jpg" src="EP01_H3_2K_원본대사_SFX.mp4"></video><div class="links"><a href="EP01_H3_2K_원본대사_SFX.mp4" download>2K 영상 내려받기</a><a href="원본대사.srt" download>원본 대사 자막 (자동 인식)</a><a href="전체장면.jpg" target="_blank">22장면 전체 보기</a><a href="../h3-2k-v1/">이전 나레이션 버전</a><a href="../../previz/blender-v2/">Blender 프리비즈</a></div><p class="muted">아빠는 화면 밖에 머뭅니다. 릴리·서진·루나가 약을 구하고, 서진의 7번 슈트로 위기를 벗어납니다. H3 원본에 들어 있던 인물 대사와 현장 효과음을 복원했습니다. 별도 설명 나레이션과 설명 자막은 제거했으며, BGM을 추가하지 않았습니다.</p><h2>장면 바로 보기</h2><div class="grid"><button class="shot" data-time="0"><img src="stills/S01.jpg" width="640" height="360" loading="lazy" alt="장면 1"><span>S01 · 00:00<br>동탄에서 원인을 알 수 없는 집단 공격이 시작됐다.</span></button><button class="shot" data-time="6"><img src="stills/S02.jpg" width="640" height="360" loading="lazy" alt="장면 2"><span>S02 · 00:06<br>재난문자가 울렸다. 큰 소리를 내지 마십시오.</span></button><button class="shot" data-time="13"><img src="stills/S03.jpg" width="640" height="360" loading="lazy" alt="장면 3"><span>S03 · 00:13<br>사흘 뒤, 호수공원의 노을 아래 좀비들이 서성였다.</span></button><button class="shot" data-time="20"><img src="stills/S04.jpg" width="640" height="360" loading="lazy" alt="장면 4"><span>S04 · 00:20<br>아픈 아빠를 위해, 엄마와 서진은 루나와 함께 약을 구했다.</span></button><button class="shot" data-time="27"><img src="stills/S05.jpg" width="640" height="360" loading="lazy" alt="장면 5"><span>S05 · 00:27<br>약만 챙겨 돌아가려던 순간, 간판이 쓰러졌다.</span></button><button class="shot" data-time="33"><img src="stills/S06.jpg" width="640" height="360" loading="lazy" alt="장면 6"><span>S06 · 00:33<br>소리를 들은 좀비들이 한꺼번에 달려왔다.</span></button><button class="shot" data-time="39"><img src="stills/S07.jpg" width="640" height="360" loading="lazy" alt="장면 7"><span>S07 · 00:39<br>세 식구가 도착한 경사로 끝에는 또 다른 무리가 있었다.</span></button><button class="shot" data-time="46"><img src="stills/S08.jpg" width="640" height="360" loading="lazy" alt="장면 8"><span>S08 · 00:46<br>앞도, 뒤도 막혔다. 도망칠 길이 보이지 않았다.</span></button><button class="shot" data-time="53"><img src="stills/S09.jpg" width="640" height="360" loading="lazy" alt="장면 9"><span>S09 · 00:53<br>엄마가 던진 휴대폰에 좀비들이 몰렸다. 하지만 전부는 아니었다.</span></button><button class="shot" data-time="60"><img src="stills/S10.jpg" width="640" height="360" loading="lazy" alt="장면 10"><span>S10 · 01:00<br>엄마는 간판을 들어 막았다. 서진에게 남은 건 손목의 시계였다.</span></button><button class="shot" data-time="67"><img src="stills/S11.jpg" width="640" height="360" loading="lazy" alt="장면 11"><span>S11 · 01:07<br>보라색 삐에로가 시계 밖으로 튀어나와 커졌다.</span></button><button class="shot" data-time="74"><img src="stills/S12.jpg" width="640" height="360" loading="lazy" alt="장면 12"><span>S12 · 01:14<br>팔 번을 스친 룰렛이, 일곱 번에서 멈췄다.</span></button><button class="shot" data-time="80"><img src="stills/S13.jpg" width="640" height="360" loading="lazy" alt="장면 13"><span>S13 · 01:20<br>붉고 금빛인 슈트가 서진의 몸을 감싸기 시작했다.</span></button><button class="shot" data-time="87"><img src="stills/S14.jpg" width="640" height="360" loading="lazy" alt="장면 14"><span>S14 · 01:27<br>기뻐할 틈도 없이, 좀비들이 다시 밀려왔다.</span></button><button class="shot" data-time="94"><img src="stills/S15.jpg" width="640" height="360" loading="lazy" alt="장면 15"><span>S15 · 01:34<br>서진은 손목을 겨눴다. 실패 끝에 거미줄이 뻗어 나갔다.</span></button><button class="shot" data-time="101"><img src="stills/S16.jpg" width="640" height="360" loading="lazy" alt="장면 16"><span>S16 · 01:41<br>경사로를 가로지른 거미줄 그물이 좀비들을 붙잡았다.</span></button><button class="shot" data-time="109"><img src="stills/S17.jpg" width="640" height="360" loading="lazy" alt="장면 17"><span>S17 · 01:49<br>서진이 엄마와 루나를 붙잡고, 거미줄에 몸을 실었다.</span></button><button class="shot" data-time="115"><img src="stills/S18.jpg" width="640" height="360" loading="lazy" alt="장면 18"><span>S18 · 01:55<br>호수 옆을 가르는 세 식구. 마지막 장애물이 눈앞으로 다가왔다.</span></button><button class="shot" data-time="123"><img src="stills/S19.jpg" width="640" height="360" loading="lazy" alt="장면 19"><span>S19 · 02:03<br>무사히 착지하자, 슈트는 다시 시계 속으로 사라졌다.</span></button><button class="shot" data-time="130"><img src="stills/S20.jpg" width="640" height="360" loading="lazy" alt="장면 20"><span>S20 · 02:10<br>엄마가 약을 확인했다. 이제 아빠에게 돌아가면 된다.</span></button><button class="shot" data-time="138"><img src="stills/S21.jpg" width="640" height="360" loading="lazy" alt="장면 21"><span>S21 · 02:18<br>하지만 집으로 가는 길에도, 더 큰 무리가 기다리고 있었다.</span></button><button class="shot" data-time="144"><img src="stills/S22.jpg" width="640" height="360" loading="lazy" alt="장면 22"><span>S22 · 02:24<br>서진이 다시 버튼을 눌렀다. 이번에는, 몇 번일까.</span></button></div></main><script>const v=document.querySelector('video');document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{v.currentTime=Number(b.dataset.time);v.play().catch(()=>{});v.scrollIntoView({behavior:'smooth',block:'center'})})</script></html>
